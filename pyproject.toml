[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predicting-tyler"
version = "0.1.0"
description = "Daily eval of AI 'taste' — which model best predicts Tyler Cowen's Substack picks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Humzah Khan" }]

# Deps are pinned loosely (compatible-release). Lock exact versions before the
# first public run so the leaderboard is reproducible.
dependencies = [
    "pydantic>=2.9,<3",
    "feedparser>=6.0,<7",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.3,<6",
    "streamlit>=1.40,<2",
    "streamlit-shadcn-ui>=0.1.18,<0.2",
    "anthropic>=0.40,<1",
    "openai>=1.50,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
